name: Daily Analyst Screen
on:
  schedule:
    - cron: '15 6 * * *' # Early backup: GitHub scheduled jobs can be delayed
      timezone: 'America/New_York'
    - cron: '0 7 * * *' # Target: 7:00 AM Eastern every day
      timezone: 'America/New_York'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analyst-screen
  cancel-in-progress: false
jobs:
  screen-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run screener
        run: python -m src.main
      - name: Refresh requested research tickers
        run: python -m src.data.research_watch
      - name: Build historical dashboard
        run: python -m src.report.dashboard
      - name: Persist last seven days in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/index.html docs/history docs/research docs/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Update daily research dashboard [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload report for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-screen-report
          path: output/
          if-no-files-found: ignore
          retention-days: 14

