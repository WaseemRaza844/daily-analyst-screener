name: Daily Analyst Screen
on:
  schedule:
    - cron: '0 7 * * *' # 7:00 AM Eastern every day
      timezone: 'America/New_York'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analyst-screen
  cancel-in-progress: false
jobs:
  screen-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Restore market cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-cache-${{ github.run_id }}
          restore-keys: |
            market-cache-
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run screener and send email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python -m src.main --send
      - name: Upload report for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-screen-report
          path: output/
          if-no-files-found: ignore
          retention-days: 14
