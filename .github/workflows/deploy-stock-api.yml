name: Deploy Stock Research API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-stock-api.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.STOCK_API_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$FINNHUB_API_KEY" || { echo "::error::Missing FINNHUB_API_KEY"; exit 1; }
      - name: Deploy Worker and secret in one request
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f secrets.ci.json' EXIT
          python -c 'import json,os;open("secrets.ci.json","w").write(json.dumps({"FINNHUB_API_KEY":os.environ["FINNHUB_API_KEY"]}))'
          npx --yes wrangler@4 deploy --secrets-file secrets.ci.json
      - name: Verify deployed AI conversation
        env:
          WORKER_URL: https://daily-stock-research-api.waseemraza844.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.WORKER_URL;
          let health=await fetch(base+"/health");
          if(!health.ok)throw new Error("Worker health check failed: "+health.status);
          const response=await fetch(base+"/chat",{
            method:"POST",headers:{"content-type":"application/json"},
            body:JSON.stringify({question:"Explain P/E in one simple sentence.",ticker:""})
          });
          const body=await response.json();
          if(!response.ok||typeof body.answer!=="string"||!body.answer.trim()){
            throw new Error("Workers AI smoke test failed: "+JSON.stringify(body).slice(0,400));
          }
          console.log("Deployed Workers AI responded successfully.");
          NODE
